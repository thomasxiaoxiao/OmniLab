name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.9.25"
          enable-cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --locked
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Verify production environment
        run: |
          uv sync --locked --no-dev --no-editable
          .venv/bin/python -c 'from omnilab.__main__ import main; assert callable(main)'
